<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Narra - Characters Vault</title>
  <link rel="stylesheet" href="charsheet.css">
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header class="app-header">
    <div class="nav-tabs">
      <button class="nav-tab">Outline</button>
      <button class="nav-tab active">Characters</button>
      <button class="nav-tab">Lore</button>
    </div>
  </header>

  <div class="obsidian-layout">
    <!-- Obsidian-Style File Explorer Sidebar -->
    <aside class="obsidian-sidebar">
      <div class="sidebar-header">
        <span>Vault: Characters</span>
        <button id="add-character-btn" class="icon-btn" title="New Note">+</button>
      </div>
      <div class="sidebar-search">
        <input type="text" id="gallery-search" placeholder="Search files...">
      </div>
      <div id="sidebar-file-list" class="sidebar-file-list">
        <!-- File list injected here -->
      </div>
    </aside>

    <main class="obsidian-workspace">
      <!-- Toolbar Toggles -->
      <div class="workspace-toolbar">
        <div class="view-toggles">
          <button id="view-gallery-btn" class="view-toggle active">⊞ Gallery</button>
          <button id="view-graph-btn" class="view-toggle">🕸 Graph View</button>
        </div>
      </div>

      <!-- View 1: Gallery -->
      <div id="character-gallery" class="gallery-grid active-view">
        <!-- Cards injected here -->
      </div>

      <!-- View 2: Obsidian Graph View -->
      <div id="graph-view-container" class="graph-view hidden-view">
        <canvas id="obsidian-graph"></canvas>
      </div>
    </main>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
