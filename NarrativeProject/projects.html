    <!-- Main Workspace -->
    <main class="workspace-main">
      <header class="workspace-header" style="display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid #e0e0e0;">
        <div class="header-left">
          <span class="breadcrumb" id="dynamic-breadcrumb"><strong class="active-project">Projects</strong></span>
        </div>
        <div class="header-actions">
          <button id="open-folder-modal" class="btn-primary" style="background-color: #4A90E2; color: white; border: none; padding: 8px 16px; border-radius: 6px; display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Folder
          </button>
        </div>
      </header>

      <!-- Grid for displaying Folders and Files -->
      <div class="recent-grid" id="file-grid" style="padding: 48px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px; align-content: start;">
        <!-- Folders/Files injected here -->
      </div>
    </main>
  </div>

  <!-- Hidden Popover for More Options (Used for Renaming and Deleting Folders/Files) -->
  <div id="file-options-menu" class="narra-popover">
    <button class="popover-item rename-opt">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
      Rename
    </button>
    <div class="popover-divider"></div>
    <button class="popover-item delete-opt">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      Delete
    </button>
  </div>

  <!-- Folder Creation Modal with Draft Selection -->
  <div id="folder-modal" class="modal-overlay hidden">
    <div class="modal-content" style="background: #fff; border-radius: 12px; max-width: 480px; width: 100%; border: 1px solid #dadce0;">
      <div class="modal-header" style="padding: 20px; border-bottom: 1px solid #dadce0; display: flex; justify-content: space-between;">
        <h2 style="margin: 0; font-size: 18px;">Create new folder</h2>
        <button id="close-modal" class="icon-btn" style="background: none; border: none; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </div>
      <div class="modal-body" style="padding: 24px;">
        <div class="input-wrapper" style="display: flex; align-items: center; border: 1px solid #dadce0; border-radius: 6px; padding: 8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#5f6368"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
          <input type="text" id="new-folder-input" value="Untitled" autocomplete="off" style="border: none; width: 100%; outline: none; margin-left: 8px; font-size: 15px;">
        </div>
        
        <!-- Checklist for Unassigned Drafts -->
        <div class="draft-selection-container">
          <h4 style="font-size: 13px; color: #5f6368; margin: 20px 0 10px 0; text-transform: uppercase;">Add unassigned drafts:</h4>
          <div id="modal-draft-list" class="draft-list">
            <!-- Checkboxes injected here by JS -->
          </div>
        </div>
      </div>
      <div class="modal-footer" style="padding: 16px 24px; border-top: 1px solid #dadce0; background: #f8f9fa; border-radius: 0 0 12px 12px; display: flex; justify-content: space-between;">
        <span style="font-size: 13px; color: #94a3b8;">Step 1 of 1</span>
        <div style="display: flex; gap: 8px;">
          <button id="cancel-folder" class="btn-secondary" style="background: none; border: 1px solid #dadce0; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Cancel</button>
          <button id="save-folder" class="btn-primary" style="background: #4A90E2; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Save Folder</button>
        </div>
      </div>
    </div>
  </div>

  <script src="projects.js"></script>
