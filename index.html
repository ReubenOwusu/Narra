    <main class="dashboard">

        <div class="header-center">

          </div>
        </div>

        <div class="header-right">

      </header>

      <div class="dashboard-content">
        <div class="creation-row">
          
          <button class="creation-card" id="new-project-btn" title="Create a new timeline">
            <div class="card-icon">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12H20M8 8v8M16 8v8M4 12a4 4 0 0 1 4-4M16 8a4 4 0 0 1 4 4"></path>
              </svg>
            </div>
            <span class="card-label">New Timeline</span>
          </button>

          <button class="creation-card" id="add-character-btn">
            <div class="card-icon">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <span class="card-label" style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
              New Character
            </span>
          </button>

          <button class="creation-card disabled-card" title="Feature coming soon" onclick="event.preventDefault();">
            <div class="card-icon">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
                <path d="M2 2l7.586 7.586"></path>
                <circle cx="11" cy="11" r="2"></circle>
              </svg>
            </div>
            <span class="card-label" style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
              Draft Story
              <span style="font-size: 11px; color: #9aa0a6; font-weight: 500;">Coming Soon</span>
            </span>
          </button>

        </div>

        <div class="dashboard-divider"></div>

        <div class="recent-files-section">
          <div class="section-header">
            <h3>Recent documents</h3>
            <div class="header-utilities">
              <button class="icon-btn disabled-nav" title="List view (Coming Soon)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg></button>
              <button class="icon-btn disabled-nav" title="Sort options (Coming Soon)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h12M3 18h6"></path></svg></button>
              <button class="icon-btn disabled-nav" title="Open file picker (Coming Soon)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg></button>
            </div>
          </div>

          <div class="recent-grid" id="project-grid">
            <!-- Cards injected by JS -->
          </div>
        </div>

      </div>
    </main>

  <!-- Hidden Popover Menu with new Folder Assignment Tool -->
  <div id="file-options-menu" class="narra-popover">
    <button class="popover-item rename-opt">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>

    <button class="popover-item duplicate-opt">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>

    <div class="popover-divider"></div>
    
    <!-- Move to Folder Option -->
    <div class="popover-item move-opt" style="padding: 0; position: relative;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 16px; top: 10px; pointer-events: none;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      <select id="popover-move-select" style="width: 100%; height: 100%; padding: 8px 16px 8px 44px; border: none; background: transparent; font-size: 14px; color: #3c4043; cursor: pointer; outline: none; appearance: none;">
        <!-- Options injected by JS -->
      </select>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 16px; top: 12px; pointer-events: none;"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>

    <div class="popover-divider"></div>
    <button class="popover-item delete-opt">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
